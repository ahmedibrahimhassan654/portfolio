<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#0b0b16" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <title>Ahmed Ibrahim — Full Stack MERN Developer</title>
    <meta
      name="description"
      content="Portfolio of Ahmed Ibrahim, a Full Stack MERN developer with 5+ years of experience building scalable web apps with React, Next.js, Node.js, Express and MongoDB."
    />
    <meta name="author" content="Ahmed Ibrahim" />
    <meta
      name="keywords"
      content="Ahmed Ibrahim, MERN Stack Developer, Full Stack Developer, React Developer, Next.js, Node.js, Express, MongoDB, Cairo, Egypt"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ahmed Ibrahim — Full Stack MERN Developer" />
    <meta
      property="og:description"
      content="5+ years building scalable, end-to-end web applications with the MERN stack."
    />
    <meta property="og:url" content="https://portfolio-gules-two-d8kt6mg2gz.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var isLight = stored === 'light'
          document.documentElement.classList.toggle('dark', !isLight)
          document.documentElement.style.colorScheme = isLight ? 'light' : 'dark'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
